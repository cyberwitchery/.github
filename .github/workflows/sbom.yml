name: sbom

# shared sbom job for cyberwitchery repos.
#
# mode: report (pull requests). generates an sbom per package for the head and
# for the last v* tag, writes the diff to the job summary, warns about
# components missing from the approved baseline, and uploads the head sboms as
# the `sbom` artifact. never fails on content.
#
# mode: release (tag pushes). packages each crate or python project, generates
# its sbom, fails on components missing from the approved baseline, and
# uploads everything as the `release-evidence` artifact. release workflows then
# call attest.yml with the `names` output to attest each package:
#
#   packages/<name>/...                the attested .crate, or wheel and sdist
#   sbom/<name>.cdx.json               the attested sbom
#   release/sbom-<tag>-<name>.cdx.json the same sbom, named for release assets
#
# the approved baseline is <baseline-dir>/<name>.cdx.json, committed in the
# calling repo. after reviewing a dependency change, commit the file from the
# pull request's `sbom` artifact (or, for rust, regenerate it with
# `cargo cyclonedx --format json --all-features --target all` at the pinned
# version and move each <crate>.cdx.json into sbom/).
#
# callers grant `contents: read`. attestation lives in attest.yml so
# that this workflow never asks for write permissions: a called workflow's
# jobs are checked against the caller's grants even when they would be skipped.

on:
  workflow_call:
    inputs:
      mode:
        description: report or release
        type: string
        required: true
      ecosystem:
        description: rust or python
        type: string
        default: rust
      packages:
        description: >
          rust: space-separated crate names (default: every publishable
          workspace member, or every member if none is publishable).
          python: space-separated project directories (default: .)
        type: string
        default: ""
      cargo-args:
        description: extra arguments for cargo cyclonedx
        type: string
        default: --all-features --target all
      package:
        description: release mode, build and attest packages (false for repos that publish nothing)
        type: boolean
        default: true
      baseline-dir:
        type: string
        default: sbom
      python-version:
        type: string
        default: "3.12"
    outputs:
      names:
        description: release mode, json list of packaged names
        value: ${{ jobs.generate.outputs.names }}

permissions: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_CYCLONEDX_VERSION: 0.5.9
  SBOM_DIFF_VERSION: 0.9.0
  CYCLONEDX_BOM_VERSION: 7.5.0

jobs:
  generate:
    name: sbom (${{ inputs.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      names: ${{ steps.collect.outputs.names }}
    env:
      MODE: ${{ inputs.mode }}
      ECOSYSTEM: ${{ inputs.ecosystem }}
      PACKAGES: ${{ inputs.packages }}
      CARGO_ARGS: ${{ inputs.cargo-args }}
      PACKAGE: ${{ inputs.package }}
      BASELINE_DIR: ${{ inputs.baseline-dir }}
    steps:
      - name: check inputs
        run: |
          case "$MODE/$ECOSYSTEM" in
            report/rust|report/python|release/rust|release/python) ;;
            *) echo "::error::unsupported mode/ecosystem: $MODE/$ECOSYSTEM" >&2; exit 1 ;;
          esac
          echo "OUT=$RUNNER_TEMP/evidence" >> "$GITHUB_ENV"

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: set up rust
        if: inputs.ecosystem == 'rust'
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable

      - name: set up python
        if: inputs.ecosystem == 'python'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: install sbom tools
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          # pinned: a cargo-cyclonedx bump changes what counts as a component,
          # and baselines must be generated by the same version.
          tool: cargo-cyclonedx@${{ env.CARGO_CYCLONEDX_VERSION }},sbom-diff@${{ env.SBOM_DIFF_VERSION }}

      - name: install python sbom tools
        if: inputs.ecosystem == 'python'
        run: |
          python -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/bin/pip" install --quiet build "cyclonedx-bom==$CYCLONEDX_BOM_VERSION"

      - name: write generator
        run: |
          cat > "$RUNNER_TEMP/sbom-gen.sh" <<'EOF'
          #!/usr/bin/env bash
          # sbom-gen.sh <source-dir> <out-dir> [package-dir]
          # writes <out-dir>/<name>.cdx.json per package, and with a third
          # argument also the packages themselves to <package-dir>/<name>/.
          set -euo pipefail
          src=$1 out=$2 pkg=${3:-}
          mkdir -p "$out"
          tools="$RUNNER_TEMP/tools/bin"

          if [ "$ECOSYSTEM" = rust ]; then
            members=$(cargo metadata --manifest-path "$src/Cargo.toml" --no-deps --format-version 1)
            if [ -n "$PACKAGES" ]; then
              names=$PACKAGES
            else
              names=$(jq -r '.packages[] | select(.publish != []) | .name' <<<"$members")
              [ -n "$names" ] || names=$(jq -r '.packages[].name' <<<"$members")
            fi
            # package before generating: cargo cyclonedx writes into the
            # source tree, and cargo package would pick those files up.
            # only the selected crates: unpublished members may lack the
            # version requirements packaging needs.
            if [ -n "$pkg" ]; then
              selected=()
              for name in $names; do selected+=(-p "$name"); done
              CARGO_TARGET_DIR="$RUNNER_TEMP/package-target" \
                cargo package --manifest-path "$src/Cargo.toml" "${selected[@]}" --no-verify
            fi
            # shellcheck disable=SC2086
            (cd "$src" && cargo cyclonedx --format json $CARGO_ARGS)
            for name in $names; do
              dir=$(jq -r --arg n "$name" '.packages[] | select(.name == $n) | .manifest_path | rtrimstr("Cargo.toml")' <<<"$members")
              if [ -z "$dir" ]; then
                echo "::error::no workspace member named $name" >&2
                exit 1
              fi
              mv "${dir}${name}.cdx.json" "$out/$name.cdx.json"
              if [ -n "$pkg" ]; then
                version=$(jq -r --arg n "$name" '.packages[] | select(.name == $n) | .version' <<<"$members")
                mkdir -p "$pkg/$name"
                cp "$RUNNER_TEMP/package-target/package/$name-$version.crate" "$pkg/$name/"
              fi
            done
            # drop the sboms of members we were not asked about.
            find "$src" -name '*.cdx.json' -not -path "$src/$BASELINE_DIR/*" -delete
          else
            dist="$RUNNER_TEMP/dist-$(basename "$out")"
            rm -rf "$dist"
            dirs=${PACKAGES:-.}
            for d in $dirs; do
              "$tools/python" -m build --outdir "$dist/$d" "$src/$d" >&2
            done
            find_links=()
            for d in $dirs; do find_links+=(--find-links "$dist/$d"); done
            for d in $dirs; do
              name=$("$tools/python" -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["project"]["name"])' "$src/$d/pyproject.toml")
              # a clean venv holds the project and its runtime dependencies,
              # and nothing from the build or the sbom tooling.
              env="$RUNNER_TEMP/env-$(basename "$out")-$name"
              rm -rf "$env"
              "$tools/python" -m venv --without-pip "$env"
              "$tools/pip" --python "$env/bin/python" install --quiet "${find_links[@]}" "$dist/$d"/*.whl
              "$tools/cyclonedx-py" environment \
                --pyproject "$src/$d/pyproject.toml" \
                --output-format JSON \
                -o "$out/$name.cdx.json" \
                "$env/bin/python"
              if [ -n "$pkg" ]; then
                mkdir -p "$pkg/$name"
                cp "$dist/$d"/* "$pkg/$name/"
              fi
            done
          fi
          EOF
          chmod +x "$RUNNER_TEMP/sbom-gen.sh"

      - name: generate
        run: |
          if [ "$MODE" = release ] && [ "$PACKAGE" = true ]; then
            "$RUNNER_TEMP/sbom-gen.sh" "$GITHUB_WORKSPACE" "$OUT/sbom" "$OUT/packages"
          else
            "$RUNNER_TEMP/sbom-gen.sh" "$GITHUB_WORKSPACE" "$OUT/sbom"
          fi

      - name: diff against last release
        if: inputs.mode == 'report'
        run: |
          tag=$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)
          if [ -z "$tag" ]; then
            echo "no v* tag reachable from HEAD, nothing to diff against" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git worktree add --quiet "$RUNNER_TEMP/base" "$tag"
          if ! "$RUNNER_TEMP/sbom-gen.sh" "$RUNNER_TEMP/base" "$RUNNER_TEMP/base-sbom"; then
            echo "::warning::could not generate sboms for $tag, skipping the diff"
            exit 0
          fi
          {
            echo "## sbom diff against $tag"
            for f in "$OUT"/sbom/*.cdx.json; do
              name=$(basename "$f" .cdx.json)
              echo
              echo "### $name"
              echo
              if [ -f "$RUNNER_TEMP/base-sbom/$name.cdx.json" ]; then
                sbom-diff "$RUNNER_TEMP/base-sbom/$name.cdx.json" "$f" -o markdown \
                  || echo "sbom-diff failed for $name"
              else
                echo "new since $tag"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: check approved baseline
        run: |
          # warnings on pull requests, errors that stop the release on tags.
          level=warning
          [ "$MODE" = release ] && level=error
          fail=0
          {
            echo "## sbom against approved baseline"
            for f in "$OUT"/sbom/*.cdx.json; do
              name=$(basename "$f" .cdx.json)
              approved="$BASELINE_DIR/$name.cdx.json"
              echo
              echo "### $name"
              echo
              if [ ! -f "$approved" ]; then
                echo "no approved sbom at \`$approved\`"
                echo "::$level::no approved sbom for $name at $approved" >&2
                fail=1
              elif ! sbom-diff "$approved" "$f" --fail-on added-components -o markdown; then
                echo "::$level::$name has components missing from $approved; review them and update the baseline" >&2
                fail=1
              else
                continue
              fi
              echo
              echo "to approve the current set, review it, then commit it as \`$approved\`; download it from this run's \`sbom\` artifact, or regenerate it locally with \`cargo cyclonedx --format json $CARGO_ARGS\` (rust)."
            done
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$level" = error ] && [ "$fail" -ne 0 ]; then
            exit 1
          fi

      - name: collect
        id: collect
        if: inputs.mode == 'release'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p "$OUT/release"
          names=()
          for f in "$OUT"/sbom/*.cdx.json; do
            name=$(basename "$f" .cdx.json)
            names+=("$name")
            cp "$f" "$OUT/release/sbom-$TAG-$name.cdx.json"
          done
          if [ "$PACKAGE" = true ]; then
            echo "names=$(jq -cn '$ARGS.positional' --args "${names[@]}")" >> "$GITHUB_OUTPUT"
          else
            echo "names=[]" >> "$GITHUB_OUTPUT"
          fi

      - name: upload sbom
        if: inputs.mode == 'report'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: ${{ runner.temp }}/evidence/sbom
          if-no-files-found: error

      - name: upload release evidence
        if: inputs.mode == 'release'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
